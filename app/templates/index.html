<!DOCTYPE html>
<html>

<head>
    <title>Crop Recommendation System</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🌾 Crop Recommendation System</h1>

        <p>
            This system predicts the most suitable crop for cultivation
            based on soil and weather conditions.
        </p>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="column">
                    <label>Nitrogen (N)</label>
                    <input type="number" name="N" value="90" required>

                    <label>Phosphorous (P)</label>
                    <input type="number" name="P" value="42" required>

                    <label>Potassium (K)</label>
                    <input type="number" name="K" value="43" required>

                    <label>pH Value</label>
                    <input type="number" step="0.01"
                        name="ph" value="6.5" required>
                </div>

                <div class="column">
                    <label>Temperature (°C)</label>
                    <input type="number" step="0.01"
                        name="temperature" value="25.5" required>

                    <label>Humidity (%)</label>
                    <input type="number" step="0.01"
                        name="humidity" value="80" required>

                    <label>Rainfall (mm)</label>
                    <input type="number" step="0.01"
                        name="rainfall" value="200" required>
                </div>

            </div>

            <button type="submit">
                Recommend Crop
            </button>

        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</body>
</html>
